  text: 在 V2EX 上看到一个很简单的抓取微信公众号文章的方法. 核心思路其实只有一句话：通过伪装成微信客户端内置浏览器来访问文章页面。 由于微信公众号网页通常会对普通浏览器触发滑块验证码等限制，而微信内置浏览器访问时不会触发这些校验，因此只需要在请求时把 User-Agent 改成微信客户端的格式即可。
