  text: 1980年，伊朗人过诺鲁孜节那天，霍梅尼宣布了一件事：大学要关。 不是关几天，是关三年。 关起来干什么？清洗。清洗那些受了西方影响的教师，清洗那些不符合伊斯兰观念的课程，清洗那些"不健康"的思想。等洗干净了，再开。
