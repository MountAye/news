  text: 下面👇这条消息说伊朗逮捕了前总统鲁哈尼及其外交部长，这是清洗伊朗国内改革派迹象。 眼下伊朗只有改革派可能跟美国和以色列合作，如果伊斯兰政权倒台，这些改革派是最可能上台组织临时政府的。 如果美国和以色列真放弃干预伊朗，这些改革派政治家会遭到史无前例的大清洗，以切断后路。
