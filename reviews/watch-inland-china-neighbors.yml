- text: 2022年中印边境冲突，塔旺地区/阿鲁纳恰尔邦
  tags: [report,陆地边境,印度,塔旺地区/阿鲁纳恰尔邦]
  author: 联合早报
  date: 2022-12-16
  url: https://www.zaobao.com.sg/realtime/china/story20221216-1344217
  details:
  - text: 参加仪式的解放军军人中，有人持的连队旗上，标有常到西藏轮训的装甲旅“77626”部队字样。
  - text: 资料显示，西藏军区原常驻有三个合成旅，分别为“山地摩托化合成部队52旅”、“高机动车辆机械化合成部队53旅”及“履带式装甲合成部队54旅”，驻守林芝、乃东及亚东，从东西两个方向面对中印边境。
