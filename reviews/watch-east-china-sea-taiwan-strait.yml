  details:
  - text: 日本政府16日以新的《国家安全保障战略》等3份安保相关文件宣告将拥有反击能力。
  - text: 日本将拥有以自卫为目的摧毁他国疆域内导弹基地等的反击能力（对敌基地攻击能力）。
  - text: 据共同社，日本政府在2015年制定了允许行使集体自卫权的安全保障相关法。但日本能够拥有的防卫力范围依旧模糊不清，而且还在继续一点点地扩大。
