- text: 从VT-4现在状况看，推测最可能的情况是泰国人的修理厂遇袭，被迫放弃。如果真是炸膛那至少也是在抢修中将炮管拆掉后的状态，可能在遇袭是被迫放弃中不得不破坏光电设备，可能用枪顶着光电窗口，才能打出这样的洞。如果是高爆弹或者破甲弹击中，损坏的状态应该是完全不同的。当然可能泰国人事后又夺回了修理厂，不然柬埔寨这边肯定照片和宣传也早都该出来了
