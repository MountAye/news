  text: 以色列國防軍（IDF）於1月底首次承認，由哈馬斯運營的加沙衛生部，其所通報的死亡人數大致準確。這意味著，過去2年多來持續的戰火導致加沙至少7,1667人死亡，包括自2025年10月「停火」以來新增的500多名死者。但就在2月4日，以色列再度以坦克砲擊與空襲加沙，導致24名巴勒斯坦人死亡，包括7名兒童。此
  url: https://x.com/initiumnews/status/2019976935732887879
