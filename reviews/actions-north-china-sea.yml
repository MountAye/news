  details:
  - text: 《九一九军事协议》或已名存实亡。另外，此举还有违1953年韩国战争《停战协定》所规定的“尊重对方军事统治下的地区和附近海域上空”。
  - text: 韩国联参表示，对于朝鲜诸如此类的挑衅，韩军今后将予以彻底而坚决的应对。
