- text: 2022年中俄东中国海联合演习
  author: Twitter@外汇交易员
  tags: [report,俄罗斯,中国,东中国海,联合演习]
  url: https://twitter.com/myfxtrader/status/1604733465991163904
  details:
  - text: 截至2022年12月19日，国际文传电讯社的英文网站上找不到相关消息。
  - text: VOA：中俄继续背靠背取暖，两国本周举行年度联合海军演习
  - text: 俄罗斯卫星通讯社：俄太平洋舰队的一支舰艇分队将参加于本周三举行的为期7天的俄中海上联合演习。
#
- text: 新闻报道
  author: DW
  date: 2022-12-23
  tags: [report,俄罗斯,中国,东中国海,联合演习]
  url: https://www.dw.com/zh/%E4%B8%AD%E4%BF%84%E8%81%AF%E5%90%88%E8%BB%8D%E6%BC%94-%E8%8E%AB%E6%96%AF%E7%A7%91%E5%9B%9E%E6%87%89%E7%BE%8E%E5%9C%8B%E5%8D%B0%E5%A4%AA%E8%BB%8D%E5%8A%9B%E9%9B%86%E7%B5%90/a-64193003
  details:
  - text: 俄罗斯太平洋舰队的瓦良格号导弹巡洋舰、沙波什尼科夫元帅号驱逐舰和两艘护卫舰参与了从21日开始的演习。
  - text: 中国则为这次演习部署了两艘驱逐舰、一艘柴油潜艇和其他几艘船。
  - text: 俄罗斯和中国的战机也参加了为期一周的演习，内容包括射击练习和反潜演习。
